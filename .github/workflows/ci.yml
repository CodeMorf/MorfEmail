name: MorfEmail Continuous Integration (CI)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Typecheck & Lint Frontend/Engine
        run: npm run lint

      - name: Run Email Validation Engine Test Suite
        run: npm test

      - name: Build Web Application Bundle
        run: npm run build

      - name: Set up Rust toolchain (Tauri Backend)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Tauri system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Check Rust Backend (Cargo Check)
        run: cargo check --manifest-path src-tauri/Cargo.toml
