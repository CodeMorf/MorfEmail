name: MorfEmail Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for the local crawler
        run: npx playwright install chromium

      - name: Validate before packaging
        run: |
          npm run lint
          npm test

      - name: Build Windows installer
        run: npm run tauri:build

      - name: Verify installer exists
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'src-tauri\target\release\bundle\nsis\*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'No se generó el instalador NSIS.' }
          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash
          "Installer: $($installer.FullName)"
          "SHA256: $hash"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: src-tauri/target/release/bundle/nsis/*-setup.exe
